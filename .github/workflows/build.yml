name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    # Weekly rebuild. Note: GitHub disables schedules after 60 days of
    # repository inactivity; re-enable the workflow in the Actions tab.
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the Docker Hub account that owns DOCKERHUB_TOKEN.
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/pdfextend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        env:
          TAG: ${{ steps.meta.outputs.version }}
        run: |
          docker rm -f pdfextend-test 2>/dev/null || true
          docker run -d --name pdfextend-test -p 8080:80 "$IMAGE_NAME:$TAG"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -qi '<title>PDFextend</title>'
          curl -fsS http://localhost:8080/pdfium.js | grep -q 'PDFiumModule'
          curl -fsSI http://localhost:8080/pdfium.wasm | grep -qi 'content-type: application/wasm'
          curl -fsS -o /dev/null http://localhost:8080/pdfium.wasm
          curl -fsS -o /dev/null http://localhost:8080/pdfextend_web_bg.wasm

      - name: Remove test container
        if: always()
        run: docker rm -f pdfextend-test 2>/dev/null || true
